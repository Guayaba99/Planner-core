<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planificador pilates</title>
<script>
try{
  var _savedTheme = JSON.parse(localStorage.getItem('reformerPlanner_theme')||'null');
  if(_savedTheme) document.documentElement.dataset.theme = _savedTheme;
  var _savedLang = JSON.parse(localStorage.getItem('reformerPlanner_lang')||'null');
  if(_savedLang) document.documentElement.lang = _savedLang;
}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1C21;
    --surface:#212328;
    --surface-2:#2A2C33;
    --surface-3:#33363E;
    --text:#EFF0F3;
    --text-secondary:#A5A8AE;
    --text-muted:#6E7178;
    --border:#383B44;
    --accent:#E3A23B;
    --accent-text:#241B08;
    --danger:#D1483B;
    --radius:10px;
    --block-group-tint: rgba(255,255,255,.015);
    --spring-ligero:#D9EAD3;
    --spring-ligero-fg:#274E13;
    --spring-medio:#E8B23D;
    --spring-medio-fg:#3D2A05;
    --spring-pesado:#E08A3E;
    --spring-pesado-fg:#40230A;
    --spring-muypesado:#D1483B;
    --spring-muypesado-fg:#FBE8E5;
  }
  :root[data-theme="light"]{
    --bg:#F7F3EA;
    --surface:#FFFFFF;
    --surface-2:#F1EBDD;
    --surface-3:#E6DEC9;
    --text:#2B2822;
    --text-secondary:#6B6455;
    --text-muted:#9C9484;
    --border:#DED4BE;
    --block-group-tint: rgba(0,0,0,.025);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding-bottom:76px;
    min-height:100vh;
  }
  h1,h2,h3,.num{font-family:'Space Grotesk',system-ui,sans-serif;}
  input,select,textarea,button{font-family:inherit; font-size:14px; color:var(--text);}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}

  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:14px 16px 12px;
  }
  .topbar .row{display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .brand{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:0 0 2px;}
  .plan-name{
    background:transparent; border:none; color:var(--text); font-size:19px; font-weight:500;
    padding:0; width:100%; outline:none;
  }
  .plan-date{background:transparent; border:none; color:var(--text-secondary); font-size:12px; padding:2px 0 0; outline:none;}
  .total-box{text-align:right; flex-shrink:0;}
  .total-box .label{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0;}
  .total-box .val{font-size:20px; font-weight:600; margin:0; color:var(--accent);}

  .logo-holder{
    width:64px; height:64px; flex-shrink:0; border-radius:14px;
    overflow:hidden; background:var(--surface);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-holder svg{width:20px; height:20px;}
  .logo-holder img, .splash-logo img{width:100%; height:100%; object-fit:contain;}
  .logo-hueso{display:none;}
  :root[data-theme="light"] .logo-carbon{display:none;}
  :root[data-theme="light"] .logo-hueso{display:block;}

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1; background:none; border:none; color:var(--text-muted);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; border-radius:8px; cursor:pointer;
  }
  .tab.active{color:var(--accent);}
  .tab .ic{width:20px; height:20px;}
  .tab span{font-size:11px;}

  .view{display:none; padding:16px 0 24px;}
  .view.active{display:block;}

  .search-wrap{position:relative; margin-bottom:14px;}
  .search-wrap input{
    width:100%; padding:10px 12px 10px 36px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); outline:none;
  }
  .search-wrap input:focus{border-color:var(--accent);}
  .search-icon{position:absolute; left:11px; top:11px; width:16px; height:16px; color:var(--text-muted);}
  .results{
    position:absolute; left:0; right:0; top:44px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--radius); max-height:260px;
    overflow:auto; z-index:15; display:none;
  }
  .result-item{padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:8px;}
  .result-item:last-child{border-bottom:none;}
  .result-item:active{background:var(--surface-3);}
  .result-item .rname{font-weight:500;}
  .result-item .rtags{font-size:11px; color:var(--text-muted); text-align:right;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:10px; border-left:3px solid var(--surface-3);
  }
  .card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .card-head .name{font-weight:500; font-size:15px;}
  .icon-btn{background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px; display:flex;}
  .icon-btn svg{width:17px; height:17px;}

  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .chip{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-secondary);
    border-radius:20px; padding:5px 11px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:5px;
  }
  .chip.on{background:rgba(227,162,59,.16); border-color:var(--accent); color:var(--accent);}
  .chip svg{width:13px; height:13px;}

  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
  .field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:3px;}
  .field input, .field select{width:100%; padding:7px 9px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; outline:none;}
  .field input:focus, .field select:focus{border-color:var(--accent);}

  .springs-row{display:flex; gap:5px; margin-bottom:8px;}
  .spring{flex:1; border-radius:8px; padding:6px 2px; text-align:center;}
  .spring .slabel{font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .spring .sctrl{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:2px;}
  .spring button{background:none; border:none; padding:2px; cursor:pointer; display:flex;}
  .spring button svg{width:12px; height:12px;}
  .spring .sval{font-size:13px; font-weight:600; min-width:14px; font-family:'Space Grotesk',sans-serif;}

  .section-label{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin:0 0 6px;}

  .notes-input{
    width:100%; padding:8px 10px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; outline:none; color:var(--text-secondary);
    font-family:inherit; line-height:1.45; resize:vertical; overflow:hidden;
  }
  .notes-input:focus{border-color:var(--accent); color:var(--text);}

  .layers-list{margin:0 0 6px;}
  .layer-row{display:flex; align-items:center; gap:7px; margin-bottom:5px; padding:6px 9px; background:var(--surface-2); border-radius:8px;}
  .layer-row .lnum{font-size:10px; font-weight:700; color:var(--accent); flex-shrink:0;}
  .layer-row .ltxt{flex:1; font-size:12.5px; color:var(--text-secondary);}
  .layer-row .lrm{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px; flex-shrink:0; padding:2px;}
  .layer-row .lrm:hover{color:var(--text);}
  .add-layer-row{display:flex; gap:6px; margin-bottom:8px;}
  .add-layer-row input{
    flex:1; padding:7px 10px; background:var(--surface-2); border:1px dashed var(--border);
    border-radius:8px; outline:none; color:var(--text); font-family:inherit; font-size:12.5px;
  }
  .add-layer-row input:focus{border-color:var(--accent); border-style:solid;}
  .add-layer-row button{
    background:var(--surface-3); border:none; color:var(--text-secondary); border-radius:8px;
    padding:0 13px; cursor:pointer; font-size:15px; font-weight:600;
  }
  .add-layer-row button:hover{color:var(--accent);}

  .pyramid{position:relative; display:flex; flex-direction:column; align-items:center; margin-bottom:11px;}
  .pyramid::before{content:''; position:absolute; top:12px; bottom:12px; left:50%; width:1px; background:linear-gradient(var(--accent), var(--border)); opacity:.35; z-index:0;}
  .py-bar{position:relative; z-index:1; border-radius:10px; padding:8px 13px; display:flex; align-items:center; gap:8px; justify-content:center; font-size:12.5px; margin-top:5px; text-align:center;}
  .py-bar:first-child{margin-top:0;}
  .py-bar.base{width:100%; background:var(--accent); color:var(--accent-text); font-weight:700;}
  .py-bar.layer{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .py-bar .dot{width:6px; height:6px; border-radius:50%; background:var(--text-muted); flex-shrink:0;}
  .py-bar.base .dot{background:var(--accent-text);}

  .empty{text-align:center; padding:40px 16px; color:var(--text-muted);}
  .empty svg{width:32px; height:32px; margin-bottom:10px; opacity:.5;}
  .empty p{margin:0; font-size:13px;}

  .btn{
    width:100%; padding:12px; border-radius:var(--radius); border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-weight:500; cursor:pointer; margin-top:4px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn svg{width:16px; height:16px;}
  .btn.primary{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
  .btn.danger{color:var(--danger); border-color:var(--danger);}
  .btn:active{transform:scale(.98);}

  .filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .filter-chip{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-secondary);
    border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer;
  }
  .filter-chip.on{background:rgba(227,162,59,.16); border-color:var(--accent); color:var(--accent);}
  .filter-chip.apparatus{font-weight:500;}

  .apparatus-toggle{
    display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:3px; gap:2px; margin-bottom:10px;
  }
  .apparatus-toggle button{
    flex:1; background:none; border:none; color:var(--text-secondary); font-family:inherit;
    font-size:13px; font-weight:500; padding:9px 6px; border-radius:9px; cursor:pointer;
  }
  .apparatus-toggle button.on{ background:var(--accent); color:var(--accent-text); }

  .origin-badge{
    font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; display:inline-block; margin-bottom:7px;
  }
  .origin-badge.clasico{ background:var(--surface-3); color:var(--text-secondary); }
  .origin-badge.sculpt{ background:rgba(227,162,59,.16); color:var(--accent); }

  .origin-section-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 4px; cursor:pointer; margin-top:2px;
  }
  .origin-section-head .label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);}
  .origin-section-head .chevron{width:15px; height:15px; color:var(--text-muted); transition:transform .15s ease; flex-shrink:0;}
  .origin-section-head.collapsed .chevron{transform:rotate(-90deg);}

  .custom-banner{
    background:rgba(227,162,59,.10); border:1px solid rgba(227,162,59,.3); border-radius:12px;
    padding:12px 14px; margin-bottom:12px; font-size:12.5px; color:var(--text-secondary); line-height:1.5;
  }

  .lib-item{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .lib-item-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .lib-item-head .name{font-weight:500;}
  .lib-tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px;}
  .tag{font-size:10px; background:var(--surface-2); color:var(--text-muted); padding:3px 8px; border-radius:20px;}
  .tag.apparatus{color:var(--accent); background:rgba(227,162,59,.12);}

  .form-block{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px;}
  .form-block h3{margin:0 0 10px; font-size:14px; font-weight:500;}
  .form-block .field{margin-bottom:10px;}
  .form-block input[type=text]{width:100%; padding:8px 10px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; outline:none;}
  .check-row{display:flex; gap:6px; flex-wrap:wrap;}
  .check-chip{background:var(--surface-2); border:1px solid var(--border); color:var(--text-secondary); border-radius:20px; padding:5px 11px; font-size:12px; cursor:pointer;}
  .check-chip.on{background:rgba(227,162,59,.16); border-color:var(--accent); color:var(--accent);}

  .saved-item{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .saved-item.dragging{
    position:relative; z-index:20; box-shadow:0 8px 20px rgba(0,0,0,.35);
    border-color:var(--accent); transition:none;
  }
  .saved-item.pressed{ background:var(--surface-2); transition:background .1s ease; }
  .menu-item{
    width:100%; display:flex; align-items:center; gap:11px; text-align:left;
    background:none; border:none; color:var(--text); padding:11px 6px; font-size:14px;
    cursor:pointer; border-radius:8px; font-family:inherit;
  }
  .menu-item:hover, .menu-item:active{ background:var(--surface-3); }
  .menu-item svg{ width:18px; height:18px; color:var(--text-muted); flex-shrink:0; }
  .menu-item-danger{ color:var(--danger); }
  .menu-item-danger svg{ color:var(--danger); }
  .drag-handle{
    background:none; border:none; color:var(--text-muted); cursor:grab; flex-shrink:0;
    padding:6px; margin-left:-6px; touch-action:none; display:flex; align-items:center;
  }
  .drag-handle:active{cursor:grabbing; color:var(--accent);}
  .drag-handle svg{width:20px; height:20px;}
  .saved-item .info{flex:1; min-width:0;}
  .saved-item .sname{font-weight:500; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .saved-item .smeta{font-size:12px; color:var(--text-muted); margin:0;}
  .saved-actions{display:flex; gap:14px; flex-shrink:0;}

  .fab{
    position:fixed; right:18px; bottom:calc(88px + env(safe-area-inset-bottom));
    width:52px; height:52px; border-radius:50%; z-index:25;
    background:var(--accent); color:var(--accent-text); border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
    transition:background .2s ease, transform .1s ease;
  }
  .fab svg{width:23px; height:23px;}
  .fab:active{transform:scale(.92);}
  .fab.fab-done{background:#6FA34C; color:#152A0B;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
    padding:20px; max-width:340px; width:100%;
  }
  .modal-msg{ margin:0 0 14px; font-size:13.5px; color:var(--text-secondary); line-height:1.5; }
  .modal-input{
    width:100%; padding:9px 11px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; outline:none; margin-bottom:14px; color:var(--text); font-size:14px;
  }
  .modal-input:focus{ border-color:var(--accent); }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions .btn{ margin-top:0; }

  .spring-row{ border:0.5px solid var(--border); border-radius:12px; margin-bottom:8px; overflow:hidden; }
  .spring-row summary{ display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; list-style:none; }
  .spring-row summary::-webkit-details-marker{ display:none; }
  .spring-dot{ width:24px; height:24px; border-radius:50%; flex-shrink:0; }
  .spring-row-label{ font-size:14px; font-weight:500; flex:1; }
  .spring-row-hex{ font-size:12px; color:var(--text-muted); font-family:monospace; }
  .spring-row-chevron{ width:16px; height:16px; color:var(--text-muted); transition:transform .15s ease; flex-shrink:0; }
  .spring-row[open] .spring-row-chevron{ transform:rotate(90deg); }
  .spring-row-body{ padding:0 14px 14px; }
  .spring-hex-input{ flex:1; padding:7px 9px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; outline:none; color:var(--text); }

  .palette-details summary{
    font-size:12px; color:var(--text-secondary); cursor:pointer; padding:4px 0;
    list-style:none; display:flex; align-items:center; gap:6px; user-select:none;
  }
  .palette-details summary::-webkit-details-marker{ display:none; }
  .palette-details summary::before{ content:"▸"; font-size:10px; color:var(--text-muted); transition:transform .15s ease; display:inline-block; }
  .palette-details[open] summary::before{ transform:rotate(90deg); }
  .swatch-grid{
    display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; padding-top:8px;
  }
  .swatch-sq{
    aspect-ratio:1; width:100%; border-radius:5px; border:2px solid var(--border);
    cursor:pointer; padding:0;
  }

  .btn-inline{width:auto; margin-top:0; padding:8px 14px;}
  .add-block-row{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-bottom:12px;}

  .block-group{
    border:1.5px dashed var(--border-block, var(--accent));
    border-radius:14px; padding:12px 10px 2px; margin-bottom:14px;
    background:var(--block-group-tint);
  }
  .block-head{
    display:flex; justify-content:space-between; align-items:center;
    margin:0 4px 10px; gap:8px;
  }
  .block-head .bname{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--border-block, var(--accent));
  }
  .block-actions{display:flex; gap:2px; flex-shrink:0;}

  .menu-wrap{position:relative; flex-shrink:0;}
  .menu-dropdown{
    position:absolute; top:calc(100% + 8px); right:0; min-width:190px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:8px; z-index:50; box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .menu-section+.menu-section{ margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .menu-section-label{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin:0 0 6px; padding:0 6px; }
  .menu-option{
    width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:8px; border-radius:8px; cursor:pointer; font-size:13.5px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .menu-option:hover{ background:var(--surface-3); }
  .menu-option.on{ color:var(--accent); font-weight:500; }
  .menu-option .chk{ width:14px; height:14px; opacity:0; flex-shrink:0; }
  .menu-option.on .chk{ opacity:1; }

  .tour-highlight{
    position:fixed; z-index:300; border-radius:10px; pointer-events:none;
    border:2px solid var(--accent); box-shadow:0 0 0 9999px rgba(0,0,0,.6);
    transition:top .2s ease, left .2s ease, width .2s ease, height .2s ease;
  }
  .tour-callout{
    position:fixed; z-index:301; max-width:270px; width:calc(100vw - 32px);
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .tour-callout p{ margin:0 0 12px; font-size:13.5px; color:var(--text); line-height:1.5; }
  .tour-nav{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .tour-step-label{ font-size:11px; color:var(--text-muted); flex-shrink:0; }
  .tour-btns{ display:flex; gap:6px; }
  .tour-btn{
    background:var(--surface-3); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .tour-btn.primary{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .tour-btn:disabled{ opacity:.35; cursor:default; }
  .tour-close{
    position:fixed; z-index:301; top:14px; right:14px; width:32px; height:32px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .tour-blocker{ position:fixed; inset:0; z-index:299; background:transparent; }

  .splash-screen{
    position:fixed; inset:0; z-index:200; background:var(--bg);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    padding:24px; transition:opacity .45s ease, transform .45s ease;
  }
  .splash-screen.hide{ opacity:0; transform:scale(1.04); pointer-events:none; }
  .splash-logo{
    width:96px; height:96px; border-radius:22px; flex-shrink:0;
    overflow:hidden; background:var(--surface);
    display:flex; align-items:center; justify-content:center;
  }
  .splash-logo svg{ width:46px; height:46px; }
  .splash-lang-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:16px;
    padding:22px; max-width:320px; width:100%; text-align:center;
    animation:splash-box-in .5s ease .1s both;
  }
  .splash-lang-box p{ margin:0 0 16px; font-size:13.5px; color:var(--text-secondary); line-height:1.6; }
  .splash-lang-row{ display:flex; gap:10px; }
  .splash-lang-row .btn{ margin-top:0; }
  @keyframes splash-box-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

<body>

<div class="splash-screen" id="splashScreen" style="display:none;">
  <div class="splash-logo" aria-hidden="true">
    <img class="logo-carbon" src="assets/icono-carbon.png" alt="">
    <img class="logo-hueso" src="assets/icono-hueso.png" alt="">
  </div>
  <div class="splash-lang-box">
    <p>Elige tu idioma<br>Choose your language</p>
    <div class="splash-lang-row">
      <button type="button" class="btn primary" id="splashEs">Español</button>
      <button type="button" class="btn primary" id="splashEn">English</button>
    </div>
  </div>
</div>

<div class="topbar">
  <div class="wrap row">
    <div class="logo-holder" aria-label="Espacio para logo" data-i18n-aria="logoSpace">

      <img class="logo-hueso" src="assets/icono-hueso.png" alt="">
    </div>
    <div id="headerInfo" style="flex:1; min-width:0;">
      <input id="planName" class="plan-name" value="Clase sin nombre">
      <input id="planDate" type="date" class="plan-date">
    </div>
    <div class="total-box" id="headerTotal">
      <p class="label" data-i18n="totalLabel">Tiempo total</p>
      <p class="val num" id="totalTime">0 min</p>
    </div>
    <button class="icon-btn" id="helpTourBtn" aria-label="Ayuda" data-i18n-aria="helpAria" style="color:var(--text); padding:6px; flex-shrink:0;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:21px; height:21px;"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.5 2.5 0 014.9.8c0 1.6-2.4 2-2.4 3.6"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="menu-wrap">
      <button class="icon-btn" id="menuBtn" aria-label="Menú" data-i18n-aria="menuAria" aria-haspopup="true" style="color:var(--text); padding:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" style="width:21px; height:21px;"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="menu-dropdown" id="menuDropdown" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="view active" id="view-clase">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchBox" placeholder="Buscar ejercicio para agregar…" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      <div class="results" id="results"></div>
    </div>

    <div class="add-block-row">
      <button class="btn btn-inline" id="addBlockBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="addBlock">Agregar bloque</span>
      </button>
    </div>

    <div id="planList"></div>
    <div class="empty" id="emptyPlan" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v4M16 4v4"/></svg>
      <p data-i18n="emptyPlan">Aún no hay ejercicios. Busca uno arriba para empezar la clase.</p>
    </div>

    <button class="btn primary" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      <span data-i18n="saveClass">Guardar esta clase</span>
    </button>
    <button class="btn" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="newClass">Empezar clase nueva</span>
    </button>
  </div>

  <div class="view" id="view-biblioteca">
    <div class="search-wrap" style="position:static;">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="libSearch" placeholder="Buscar en la biblioteca…" data-i18n-placeholder="libSearchPlaceholder" autocomplete="off">
    </div>
    <div class="filter-row" id="apparatusRow"></div>
    <div class="filter-row" id="originRow" style="display:none;"></div>
    <div class="filter-row" id="filterRow"></div>

    <div class="custom-banner" id="customBanner" style="display:none;"></div>
    <div class="form-block" id="formBlock" style="display:none;">
      <h3 data-i18n="addExerciseHeading">Agregar ejercicio nuevo</h3>
      <div class="field"><input type="text" id="newExName" placeholder="Nombre del ejercicio" data-i18n-placeholder="exerciseNamePlaceholder"></div>
      <div class="field-grid">
        <div class="field">
          <label data-i18n="apparatusLabel">Aparato</label>
          <select id="newExApparatus"><option value="mat">Mat</option><option value="reformer">Reformer</option></select>
        </div>
        <div class="field">
          <label data-i18n="strapsDefaultLabel">Straps por defecto</label>
          <select id="newExStraps"></select>
        </div>
      </div>
      <div class="field">

      </div>

        <div class="check-row" id="newExPropsRow"></div>

  </div>

    </button>

    <div id="savedList"></div>

<div class="tabbar">

</div>

/* ---------- almacenamiento ---------- */
function showModal({message, type="confirm", defaultValue=""}){
  return new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <p class="modal-msg"></p>
        ${type==="prompt" ? `<input type="text" class="modal-input">` : ""}
        <div class="modal-actions">
          <button type="button" class="btn modal-cancel">${t('cancel')}</button>
          <button type="button" class="btn primary modal-ok">${type==="prompt" ? t('save') : t('accept')}</button>
        </div>
      </div>`;
    overlay.querySelector(".modal-msg").textContent = message;
    const input = overlay.querySelector(".modal-input");
    if(input) input.value = defaultValue;
    document.body.appendChild(overlay);
    if(input){ input.focus(); input.select(); }

    function cleanup(result){ overlay.remove(); resolve(result); }
    overlay.querySelector(".modal-cancel").addEventListener("click", ()=>cleanup(type==="prompt" ? null : false));
    overlay.querySelector(".modal-ok").addEventListener("click", ()=>cleanup(type==="prompt" ? input.value : true));
    if(input){
      input.addEventListener("keydown", e=>{
        if(e.key==="Enter") cleanup(input.value);
        if(e.key==="Escape") cleanup(null);
      });
    }
    overlay.addEventListener("click", e=>{ if(e.target===overlay) cleanup(type==="prompt" ? null : false); });
  });
}
function showConfirm(message){ return showModal({message, type:"confirm"}); }
function showPrompt(message, defaultValue){ return showModal({message, type:"prompt", defaultValue}); }

};
function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

const isFirstLaunch = localStorage.getItem(LS.lang) === null;

let library = load(LS.lib, [...MAT_DB, ...SCULPT_DB, ...REFORMER_DB]);
if(!library.some(e=>e.origin==="sculpt")){
  library = [...library, ...SCULPT_DB];
  save(LS.lib, library);
}
library = library.map(e=>({...e, props: Array.isArray(e.props) ? e.props.filter(pid=>PROPS_DB.some(p=>p.id===pid)) : []}));

function normalizeItem(it){
  const springs = {};
  SPRINGS.forEach(s=>{ springs[s.k] = (it.springs && Number.isFinite(+it.springs[s.k])) ? +it.springs[s.k] : 0; });
  let props = it.props;
  props = Array.isArray(props) ? props.filter(pid=>PROPS_DB.some(p=>p.id===pid)) : [];
  return {
    n: it.n || t('unnamedExercise'),
    apparatus: it.apparatus === "reformer" ? "reformer" : "mat",
    straps: STRAPS_OPTS.includes(it.straps) ? it.straps : "N/A",
    box: BOX_OPTS.includes(it.box) ? it.box : "N/A",
    jump: !!it.jump,
    props,
    reps: Number.isFinite(+it.reps) ? +it.reps : 0,

    springs,

/* normaliza bloques + items de un plan, asegurando que cada blockId apunte a un bloque real */
function normalizePlanShape(planObj){
  const blocks = Array.isArray(planObj.blocks)
    ? planObj.blocks.filter(b=>b && typeof b.id==="string").map(b=>({id:b.id, name: (typeof b.name==="string" && b.name.trim()) ? b.name.trim() : t('blockLabel')}))
    : [];
  const blockIds = new Set(blocks.map(b=>b.id));
  const items = (planObj.items||[]).map(it=>{
    const norm = normalizeItem(it);
    if(norm.blockId && !blockIds.has(norm.blockId)) norm.blockId = null;
    return norm;
  });
  return { blocks, items };
}

const DEFAULT_SPRING_COLORS = { ligero:"#D9EAD3", medio:"#E8B23D", pesado:"#E08A3E", muypesado:"#D1483B" };
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,"0");
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}
const PALETTE_HUES = [0,15,30,45,60,80,110,140,165,185,205,225,250,275,300,325,345];
const PRESET_COLORS = [];
PALETTE_HUES.forEach(h=>{
  PRESET_COLORS.push(hslToHex(h,70,82), hslToHex(h,65,62), hslToHex(h,60,38));
});

function contrastColor(hex){
  const c = hex.replace("#","");
  const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
  const yiq = (r*299 + g*587 + b*114)/1000;
  return yiq >= 140 ? "#241B08" : "#F2EFE9";
}

const BLOCK_PALETTE = ["#E3A23B","#6FA8DC","#93C47D","#C27BA0","#76A5AF","#E06666","#B48EAD","#F0B67F"];
function blockColor(blocks, blockId){
  const idx = blocks.findIndex(b=>b.id===blockId);
  return BLOCK_PALETTE[idx>=0 ? idx % BLOCK_PALETTE.length : 0];
}
function findBlock(blockId){ return plan.blocks.find(b=>b.id===blockId); }

async function removeBlock(blockId){

  if(!ok) return;

  plan.items.forEach(it=>{ if(it.blockId===blockId) it.blockId=null; });

}
function getBlockRun(items, blockId){
  const start = items.findIndex(it=>it.blockId===blockId);
  if(start===-1) return null;
  let end = start;
  while(end < items.length && items[end].blockId === blockId) end++;
  return { start, end };
}

function moveBlock(blockId, dir){
  const run = getBlockRun(plan.items, blockId);
  if(!run) return;
  const len = run.end - run.start;
  if(dir < 0){
    if(run.start === 0) return;
    const prevItem = plan.items[run.start-1];
    let insertAt;
    if(prevItem.blockId){
      insertAt = getBlockRun(plan.items, prevItem.blockId).start;
    } else {
      insertAt = run.start - 1;
    }
    const blockItems = plan.items.splice(run.start, len);
    plan.items.splice(insertAt, 0, ...blockItems);
  } else {
    if(run.end >= plan.items.length) return;
    const nextItem = plan.items[run.end];
    let nextEnd;
    if(nextItem.blockId){
      nextEnd = getBlockRun(plan.items, nextItem.blockId).end;
    } else {
      nextEnd = run.end + 1;
    }
    const blockItems = plan.items.splice(run.start, len);
    plan.items.splice(nextEnd - len, 0, ...blockItems);
  }
  persistPlan();
  renderPlan();
}

function assignItemToBlock(i, blockId){
  const it = plan.items[i];
  if(!it) return;
  if(!blockId){
    it.blockId = null;
    persistPlan();
    renderPlan();
    return;
  }
  it.blockId = blockId;
  plan.items.splice(i,1);
  let lastIdx = -1;
  plan.items.forEach((x,idx)=>{ if(x.blockId===blockId) lastIdx = idx; });
  plan.items.splice(lastIdx===-1 ? plan.items.length : lastIdx+1, 0, it);
  persistPlan();
  renderPlan();
}

/* agrupa items consecutivos que comparten blockId en bloques visuales */
function buildGroupedHtml(items, blocks, cardRenderer, editable){
  let html = "";
  let idx = 0;
  while(idx < items.length){
    const it = items[idx];
    if(it.blockId){
      const block = blocks.find(b=>b.id===it.blockId);
      const runStart = idx;
      let runEnd = idx;
      while(runEnd < items.length && items[runEnd].blockId === it.blockId) runEnd++;
      const runItems = items.slice(runStart, runEnd);
      const color = blockColor(blocks, it.blockId);
      html += `
      <div class="block-group" style="--border-block:${color};">
        <div class="block-head">
          <span class="bname">${escapeHtml(block ? block.name : t('blockLabel'))}</span>
          ${editable ? `
          <div class="block-actions">
            <button class="icon-btn" data-act="block-up" data-bid="${it.blockId}" aria-label="${t('moveBlockUp')}" ${runStart===0?'style="opacity:.3; pointer-events:none;"':''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
            </button>
            <button class="icon-btn" data-act="block-down" data-bid="${it.blockId}" aria-label="${t('moveBlockDown')}" ${runEnd===items.length?'style="opacity:.3; pointer-events:none;"':''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <button class="icon-btn" data-act="rename-block" data-bid="${it.blockId}" aria-label="${t('renameBlockAria')}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button class="icon-btn" data-act="remove-block" data-bid="${it.blockId}" aria-label="${t('removeBlockAria')}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>` : ""}
        </div>
        ${runItems.map((ri,k)=>cardRenderer(ri, runStart+k)).join("")}
      </div>`;
      idx = runEnd;
    } else {
      html += cardRenderer(it, idx);
      idx++;
    }
  }
  return html;
}

/* ---------- arrastrar para reordenar ejercicios de la clase ---------- */
function bindPlanDrag(){
  const cards = Array.from(planList.querySelectorAll('.card[data-i]'));
  if(cards.length < 2) return;
  const naturalTop = [];
  const heights = [];
  const baseTop = cards[0].getBoundingClientRect().top;
  cards.forEach(c=>{
    const st = getComputedStyle(c);
    naturalTop.push(c.getBoundingClientRect().top);
    heights.push(c.offsetHeight + parseFloat(st.marginBottom || 0));
  });

  planList.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault();
      const item = handle.closest('.card');
      const startPos = cards.indexOf(item);
      if(startPos === -1) return;
      let order = cards.map((_,k)=>k);
      let currentPos = startPos;
      const startY = e.clientY;

      item.classList.add('dragging');
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      function applyOrder(){
        const remaining = order.filter(o=>o!==startPos);
        let acc = 0;
        remaining.forEach(origPos=>{
          const target = baseTop + acc;
          const offset = target - naturalTop[origPos];
          const el = cards[origPos];
          el.style.transition = 'transform .15s ease';
          el.style.transform = offset ? `translateY(${offset}px)` : '';
          acc += heights[origPos];
        });
      }

      function onMove(ev){
        const dy = ev.clientY - startY;
        item.style.transform = `translateY(${dy}px)`;
        const draggedCenter = (naturalTop[startPos] - baseTop) + heights[startPos]/2 + dy;

        const remaining = order.filter(o=>o!==startPos);
        let acc = 0, newPos = remaining.length;
        for(let k=0; k<remaining.length; k++){
          const h = heights[remaining[k]];
          if(draggedCenter < acc + h/2){ newPos = k; break; }
          acc += h;
        }
        if(newPos !== currentPos){
          order = remaining;
          order.splice(newPos, 0, startPos);
          currentPos = newPos;
          applyOrder();
        }
      }

      function onUp(){
        try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        item.classList.remove('dragging');
        item.style.transform = '';
        cards.forEach(c=>{ c.style.transform=''; c.style.transition=''; });

        if(currentPos !== startPos){
          const dir = currentPos > startPos ? 1 : -1;
          for(let k=startPos; k!==currentPos; k+=dir){
            [plan.items[k], plan.items[k+dir]] = [plan.items[k+dir], plan.items[k]];
          }
          persistPlan();
        }
        renderPlan();
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

function bindPlanEvents(){
  planList.querySelectorAll('[data-act="remove"]').forEach(b=>b.addEventListener("click", ()=>{
    plan.items.splice(+b.dataset.i,1); persistPlan(); renderPlan();
  }));
  planList.querySelectorAll('[data-act="straps-select"]').forEach(sel=>sel.addEventListener("change", ()=>{
    plan.items[+sel.dataset.i].straps = sel.value; persistPlan();
  }));
  planList.querySelectorAll('[data-act="box-select"]').forEach(sel=>sel.addEventListener("change", ()=>{
    plan.items[+sel.dataset.i].box = sel.value; persistPlan();
  }));
  planList.querySelectorAll('[data-act="block-select"]').forEach(sel=>sel.addEventListener("change", ()=>{
    assignItemToBlock(+sel.dataset.i, sel.value || null);
  }));
  planList.querySelectorAll('[data-act="rename-block"]').forEach(b=>b.addEventListener("click", ()=> renameBlock(b.dataset.bid)));
  planList.querySelectorAll('[data-act="remove-block"]').forEach(b=>b.addEventListener("click", ()=> removeBlock(b.dataset.bid)));
  planList.querySelectorAll('[data-act="block-up"]').forEach(b=>b.addEventListener("click", ()=> moveBlock(b.dataset.bid, -1)));
  planList.querySelectorAll('[data-act="block-down"]').forEach(b=>b.addEventListener("click", ()=> moveBlock(b.dataset.bid, 1)));
  planList.querySelectorAll('[data-act="jump"]').forEach(b=>b.addEventListener("click", ()=>{
    const it=plan.items[+b.dataset.i]; it.jump=!it.jump; persistPlan(); renderPlan();
  }));
  planList.querySelectorAll('[data-act="add-prop"]').forEach(sel=>sel.addEventListener("change", ()=>{
    if(!sel.value) return;
    const it=plan.items[+sel.dataset.i];
    if(!it.props.includes(sel.value)) it.props.push(sel.value);
    persistPlan(); renderPlan();
  }));
  planList.querySelectorAll('[data-act="remove-prop"]').forEach(b=>b.addEventListener("click", ()=>{
    const it=plan.items[+b.dataset.i];
    it.props = it.props.filter(p=>p!==b.dataset.pid);
    persistPlan(); renderPlan();
  }));
  planList.querySelectorAll('[data-act="spring+"],[data-act="spring-"]').forEach(b=>b.addEventListener("click", ()=>{
    const it=plan.items[+b.dataset.i]; const delta = b.dataset.act==="spring+" ? 1 : -1;
    it.springs[b.dataset.k] = Math.max(0, it.springs[b.dataset.k]+delta);
    persistPlan(); renderPlan();
  }));
  planList.querySelectorAll('[data-field]').forEach(inp=>inp.addEventListener("input", ()=>{
    const it=plan.items[+inp.dataset.i]; const f=inp.dataset.field;
    it[f] = (f==="reps"||f==="seg") ? (inp.value===""?0:+inp.value) : inp.value;
    persistPlan();
    if(f==="seg") renderTotal();
  }));
  planList.querySelectorAll('[data-act="add-layer"]').forEach(b=>b.addEventListener("click", ()=>{
    const i = +b.dataset.i;
    const input = planList.querySelector(`[data-act="layer-input"][data-i="${i}"]`);
    const val = input.value.trim();
    if(!val) return;
    const it = plan.items[i];
    it.layers = it.layers || [];
    it.layers.push(val);
    persistPlan(); renderPlan();
  }));
  planList.querySelectorAll('[data-act="layer-input"]').forEach(inp=>inp.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); planList.querySelector(`[data-act="add-layer"][data-i="${inp.dataset.i}"]`).click(); }
  }));
  planList.querySelectorAll('[data-act="remove-layer"]').forEach(b=>b.addEventListener("click", ()=>{
    const it = plan.items[+b.dataset.i];
    it.layers.splice(+b.dataset.li, 1);
    persistPlan(); renderPlan();
  }));
  planList.querySelectorAll('.notes-input').forEach(ta=>{
    autoGrowTextarea(ta);
    ta.addEventListener("input", ()=>autoGrowTextarea(ta));
  });
}

function autoGrowTextarea(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

function renderTotal(){
  const totalSeg = plan.items.reduce((s,it)=>s+(+it.seg||0),0);
  document.getElementById("totalTime").textContent = (totalSeg/60).toFixed(1)+" "+t('minUnit');
}

async function resolveUniqueSavedName(candidateName){
  const nameExists = n => savedPlans.some(p => p.name.trim().toLowerCase() === n.trim().toLowerCase());
  let name = (candidateName || t('defaultPlanName')).trim();
  while(nameExists(name)){
    const proposed = await showPrompt(t('duplicateNamePrompt', name), name);
    if(proposed === null) return null; // canceló
    const trimmed = proposed.trim();
    if(trimmed) name = trimmed;
    // si dejó el campo vacío, vuelve a preguntar con el mismo nombre repetido
  }
  return name;
}

async function saveCurrentClass(){
  if(editingSavedIndex !== null){
    const ok = await showConfirm(t('confirmSaveChanges', plan.name));
    if(!ok) return;
    const existing = savedPlans[editingSavedIndex];
    const snapshot = JSON.parse(JSON.stringify(plan));
    snapshot.id = existing ? existing.id : Date.now().toString();
    snapshot.favorite = existing ? !!existing.favorite : false;
    snapshot.listId = existing ? (existing.listId || null) : null;
    snapshot.savedAt = new Date().toISOString();
    savedPlans[editingSavedIndex] = snapshot;
    persistSaved();
    const btn = document.getElementById("saveBtn");
    const original = btn.innerHTML;
    btn.innerHTML = t('changesSaved');
    setTimeout(()=>btn.innerHTML=original, 1200);
    const fab = document.getElementById("fabSave");
    fab.classList.add("fab-done");
    setTimeout(()=>fab.classList.remove("fab-done"), 1200);
    return;
  }
  const nameToSave = await resolveUniqueSavedName(plan.name);
  if(nameToSave === null) return; // canceló, no guarda

  if(nameToSave !== plan.name){
    plan.name = nameToSave;
    document.getElementById("planName").value = nameToSave;
    persistPlan();
  }

  const snapshot = JSON.parse(JSON.stringify(plan));
  snapshot.id = Date.now().toString();
  snapshot.favorite = false;
  snapshot.listId = null;
  snapshot.savedAt = new Date().toISOString();
  savedPlans.unshift(snapshot);
  persistSaved();

  const btn = document.getElementById("saveBtn");
  const original = btn.innerHTML;
  btn.innerHTML = t('classSaved');
  setTimeout(()=>btn.innerHTML=original, 1200);

  const fab = document.getElementById("fabSave");
  fab.classList.add("fab-done");
  setTimeout(()=>fab.classList.remove("fab-done"), 1200);
}
document.getElementById("saveBtn").addEventListener("click", saveCurrentClass);
document.getElementById("fabSave").addEventListener("click", saveCurrentClass);


document.getElementById("newBtn").addEventListener("click", async ()=>{
  if(plan.items.length){
    const ok = await showConfirm(t('confirmNewClass'));
    if(!ok) return;
  }
  plan = { name:t('defaultPlanName'), date:new Date().toISOString().slice(0,10), items:[], blocks:[] };
  editingSavedIndex = null;
  persistPlan();
  document.getElementById("planName").value = plan.name;
  document.getElementById("planDate").value = plan.date;
  renderPlan();
});

/* ---------- biblioteca ---------- */
const libSearch = document.getElementById("libSearch");
const libList = document.getElementById("libList");
const filterRow = document.getElementById("filterRow");
const apparatusRow = document.getElementById("apparatusRow");
const originRow = document.getElementById("originRow");
const customBanner = document.getElementById("customBanner");
const formBlock = document.getElementById("formBlock");

function renderApparatusFilter(){
  const opts = [["mat",t('filterMat')],["reformer",t('filterReformer')],["custom",t('filterCustom')]];
  apparatusRow.innerHTML = `<div class="apparatus-toggle">${opts.map(([id,label])=>`
    <button class="${activeApparatusFilter===id?'on':''}" data-a="${id}">${label}</button>
  `).join("")}</div>`;
  apparatusRow.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{
    if(activeApparatusFilter === b.dataset.a) return;
    activeApparatusFilter = b.dataset.a;
    activeGroupFilter = null;
    activeOriginFilter = null;
    renderLibrary();
  }));
}
function renderOriginFilter(){
  const opts = [["clasico",t('originClasico')],["sculpt",t('originSculpt')]];
  originRow.innerHTML = opts.map(([id,label])=>`
    <button class="filter-chip ${activeOriginFilter===id?'on':''}" data-o="${id}">${label}</button>
  `).join("");
  originRow.querySelectorAll(".filter-chip").forEach(b=>b.addEventListener("click", ()=>{
    activeOriginFilter = activeOriginFilter===b.dataset.o ? null : b.dataset.o;
    activeGroupFilter = null;
    renderLibrary();
  }));
}
function scopedLibrary(){
  if(activeApparatusFilter === "custom") return library.filter(e=>e.custom);
  let list = library.filter(e=>e.apparatus===activeApparatusFilter && !e.custom);
  if(activeApparatusFilter === "mat" && activeOriginFilter) list = list.filter(e=>e.origin===activeOriginFilter);
  return list;
}
function allGroups(){
  const s = new Set();
  scopedLibrary().forEach(e=>e.groups.forEach(g=>s.add(g)));
  return [...s].sort();
}
function renderFilters(){
  filterRow.innerHTML = allGroups().map(g=>`
    <button class="filter-chip ${activeGroupFilter===g?'on':''}" data-g="${g}">${groupLabel(g)}</button>
  `).join("");
  filterRow.querySelectorAll(".filter-chip").forEach(b=>b.addEventListener("click", ()=>{
    activeGroupFilter = activeGroupFilter===b.dataset.g ? null : b.dataset.g;
    renderFilters(); renderLibrary();
  }));
}
function renderLibrary(){
  renderApparatusFilter();
  const isCustom = activeApparatusFilter === "custom";
  const isMat = activeApparatusFilter === "mat";

  originRow.style.display = isMat ? "flex" : "none";
  if(isMat) renderOriginFilter();

  const matNeedsOrigin = isMat && !activeOriginFilter;
  filterRow.style.display = (isCustom || matNeedsOrigin) ? "none" : "flex";
  formBlock.style.display = isCustom ? "block" : "none";
  customBanner.style.display = isCustom ? "block" : "none";
  if(isCustom) customBanner.textContent = t('customBannerText');
  if(!isCustom && !matNeedsOrigin) renderFilters();

  const q = libSearch.value.trim().toLowerCase();
  const filtered = scopedLibrary().filter(e=>{
    const matchQ = !q || e.n.toLowerCase().includes(q);
    const matchG = isCustom || !activeGroupFilter || e.groups.includes(activeGroupFilter);
    return matchQ && matchG;
  });

  const itemHtml = e => `
    <div class="lib-item">
      <div class="lib-item-head">
        <span class="name">${escapeHtml(e.n)}</span>
        <div style="display:flex; gap:2px; flex-shrink:0;">
          ${e.custom ? `
          <button class="icon-btn" data-act="delete-custom" data-id="${e.id}" aria-label="${t('deleteExerciseAria')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
          </button>` : ''}
          <button class="icon-btn" data-act="add-to-plan" data-id="${e.id}" aria-label="${t('addToClassAria')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      ${e.apparatus==='mat' ? `<span class="origin-badge ${e.origin}">${e.origin==='sculpt' ? t('originSculpt') : t('originClasico')}</span>` : ''}
      <div class="lib-tags">
        <span class="tag apparatus">${apparatusLabel(e.apparatus)}</span>
        ${e.pos ? `<span class="tag">${posLabel(e.pos)}</span>` : ''}
        ${e.groups.map(g=>`<span class="tag">${groupLabel(g)}</span>`).join("")}
        ${e.props.map(pid=>`<span class="tag">${propName(pid)}</span>`).join("")}
      </div>
    </div>
  `;

  const sectionHtml = (originKey, label, items) => {
    if(!items.length) return '';
    const collapsed = !!collapsedOrigins[originKey];
    return `
      <div class="origin-section-head ${collapsed?'collapsed':''}" data-origin-toggle="${originKey}">
        <span class="label">${label} · ${items.length}</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      ${collapsed ? '' : items.map(itemHtml).join("")}
    `;
  };

  if(isMat && !activeOriginFilter){
    const clasicos = filtered.filter(e=>e.origin==='clasico').sort((a,b)=>a.order-b.order);
    const sculpts = filtered.filter(e=>e.origin==='sculpt').sort((a,b)=>a.order-b.order);
    const body = sectionHtml('clasico', t('classicLibrary'), clasicos) + sectionHtml('sculpt', t('originSculpt'), sculpts);
    libList.innerHTML = body || `<p style="color:var(--text-muted); font-size:13px;">${t('noFilterResults')}</p>`;
  } else {
    const sorted = filtered.sort((a,b)=>a.order-b.order);
    libList.innerHTML = sorted.length
      ? sorted.map(itemHtml).join("")
      : (isCustom
          ? `<p style="color:var(--text-muted); font-size:12px;">${t('noCustomYet')}</p>`
          : `<p style="color:var(--text-muted); font-size:13px;">${t('noFilterResults')}</p>`);
  }

  libList.querySelectorAll('[data-origin-toggle]').forEach(h=>h.addEventListener("click", ()=>{
    const k = h.dataset.originToggle;
    collapsedOrigins[k] = !collapsedOrigins[k];
    renderLibrary();
  }));
  libList.querySelectorAll('[data-act="add-to-plan"]').forEach(b=>b.addEventListener("click", ()=>{
    const ex = library.find(e=>e.id===b.dataset.id);
    plan.items.push(blankItem(ex));
    persistPlan();
    renderTotal();
    b.closest(".lib-item").style.borderColor = "var(--accent)";
    setTimeout(()=>{ b.closest(".lib-item").style.borderColor = "var(--border)"; }, 500);
  }));
  libList.querySelectorAll('[data-act="delete-custom"]').forEach(b=>b.addEventListener("click", async ()=>{
    const ok = await showConfirm(t('confirmDeleteCustomExercise'));
    if(!ok) return;
    library = library.filter(e=>e.id!==b.dataset.id);
    persistLib();
    renderLibrary();
  }));
}
libSearch.addEventListener("input", renderLibrary);

document.getElementById("addLibBtn").addEventListener("click", ()=>{
  const nameInput = document.getElementById("newExName");
  const groupsInput = document.getElementById("newExGroups");
  const apparatus = document.getElementById("newExApparatus").value;
  const straps = document.getElementById("newExStraps").value;
  const box = document.getElementById("newExBox").value;

    id: name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now(),

  });

  const pill = txt => `<span style="font-size:12.5px; color:var(--text); background:var(--surface-3); padding:3px 10px; border-radius:20px; display:inline-block;">${txt}</span>`;
  return `
    <div class="card" style="border-left-color:${it.apparatus==='reformer'?dominantSpringColor(it.springs):'var(--surface-3)'}">
      <div class="card-head"><span class="name">${escapeHtml(it.n)} <span class="tag apparatus" style="margin-left:4px;">${apparatusLabel(it.apparatus)}</span></span></div>
      ${(it.layers||[]).length ? `
      <div class="pyramid">
        <div class="py-bar base"><span class="dot"></span>${escapeHtml(it.n)}</div>
        ${it.layers.map((l,li)=>{
          const widths=[84,70,58,48,42];
          const w = widths[Math.min(li, widths.length-1)];
          return `<div class="py-bar layer" style="width:${w}%;"><span class="dot"></span>${escapeHtml(l)}</div>`;
        }).join("")}

      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px;">

          it.straps!=='N/A' ? pill(`${t('strapsLabel')}: ${strapsLabel(it.straps)}`) : '',
          it.box!=='N/A' ? pill(`${t('boxLabel')}: ${boxLabel(it.box)}`) : '',
          it.jump ? pill(`Jumpboard: ${t('yes')}`) : ''
        ].join('') : ''}
        ${pill(`${it.reps} ${t('repsUnit')}`)}${pill(`${it.seg} ${t('segUnit')}`)}
        ${it.props.map(pid=>pill(propName(pid))).join("")}

/* ---------- listas de clases guardadas ---------- */
function findSavedList(id){ return savedLists.find(l=>l.id===id); }
function savedListName(id){ const l = findSavedList(id); return l ? l.name : ""; }

async function addSavedList(){
  const name = await showPrompt(t('newListPrompt'), "");
  if(name===null) return null;
  const trimmed = name.trim();
  if(!trimmed) return null;
  const list = { id: uid(), name: trimmed };
  savedLists.push(list);
  persistSavedLists();
  return list.id;
}
async function renameSavedList(id){
  const l = findSavedList(id);
  if(!l) return;
  const name = await showPrompt(t('renameListPrompt'), l.name);
  if(name===null) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  l.name = trimmed;
  persistSavedLists();
}
async function removeSavedList(id){
  const ok = await showConfirm(t('confirmRemoveList'));
  if(!ok) return;
  savedLists = savedLists.filter(l=>l.id!==id);
  persistSavedLists();
  savedPlans.forEach(p=>{ if(p.listId===id) p.listId=null; });
  persistSaved();
  if(activeListFilter===id) activeListFilter = null;
}

function showListPickerModal(currentListId){
  return new Promise(resolve=>{
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    function cleanup(result){ overlay.remove(); resolve(result); }
    function render(){
      overlay.innerHTML = `
        <div class="modal-box">
          <p class="modal-msg">${t('chooseListIntro')}</p>
          <button type="button" class="filter-chip ${!currentListId?'on':''}" data-assign="" style="width:100%; text-align:left; margin-bottom:8px;">${t('noList')}</button>
          <div id="listOptionsWrap"></div>
          <button type="button" class="btn" id="addListBtnInModal" style="margin-bottom:0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            ${t('newListChip')}
          </button>
          <div class="modal-actions">
            <button type="button" class="btn modal-cancel" style="width:100%;">${t('cancel')}</button>
          </div>
        </div>`;
      const wrap = overlay.querySelector("#listOptionsWrap");
      wrap.innerHTML = savedLists.map(l=>`
        <div style="display:flex; align-items:center; gap:4px; margin-bottom:6px;">
          <button type="button" class="filter-chip ${currentListId===l.id?'on':''}" data-assign="${l.id}" style="flex:1; text-align:left;">${escapeHtml(l.name)}</button>
          <button type="button" class="icon-btn" data-rename="${l.id}" aria-label="${t('renameListAria')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button type="button" class="icon-btn" data-remove="${l.id}" aria-label="${t('removeListAria')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      `).join("");

      overlay.querySelectorAll('[data-assign]').forEach(b=>b.addEventListener("click", ()=>cleanup({assign:b.dataset.assign})));
      overlay.querySelectorAll('[data-rename]').forEach(b=>b.addEventListener("click", async e=>{
        e.stopPropagation();
        await renameSavedList(b.dataset.rename);
        render();
      }));
      overlay.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener("click", async e=>{
        e.stopPropagation();
        await removeSavedList(b.dataset.remove);
        if(currentListId === b.dataset.remove) currentListId = null;
        render();
      }));
      overlay.querySelector("#addListBtnInModal").addEventListener("click", async ()=>{
        const newId = await addSavedList();
        if(newId){ cleanup({assign:newId}); }
        else render();
      });
      overlay.querySelector(".modal-cancel").addEventListener("click", ()=>cleanup(null));
    }
    render();
    document.body.appendChild(overlay);
    overlay.addEventListener("click", e=>{ if(e.target===overlay) cleanup(null); });
  });
}

/* ---------- compartir / importar clases ---------- */
function sanitizeFileName(name){
  return (name || "clase").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "clase";
}

async function shareSavedClass(index){
  const p = savedPlans[index];
  const payload = {
    app: "pilatesPlanner", type: "class", version: 1,
    plan: { name: p.name, date: p.date, items: p.items, blocks: p.blocks || [] }
  };
  const jsonStr = JSON.stringify(payload, null, 2);
  const fileName = `${sanitizeFileName(p.name)}.json`;

  try{
    const Filesystem = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
    const Share = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    if(Filesystem && Share){
      const written = await Filesystem.writeFile({ path: fileName, data: jsonStr, directory: "CACHE", encoding: "utf8" });
      await Share.share({ title: p.name, dialogTitle: t('shareClassDialogTitle'), url: written.uri });
      return;
    }
  }catch(e){ /* si falla la vía nativa, sigue con el respaldo web */ }

  if(navigator.share){
    try{
      const file = new File([jsonStr], fileName, { type: "application/json" });
      if(!navigator.canShare || navigator.canShare({ files:[file] })){
        await navigator.share({ title: p.name, files:[file] });
        return;
      }
    }catch(e){ /* cancelado o no soportado, sigue con el respaldo de descarga */ }
  }

  const blob = new Blob([jsonStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function importClassFromFile(file){
  let data;
  try{
    const text = await file.text();
    data = JSON.parse(text);
  }catch(e){
    await showConfirm(t('importInvalidFile'));
    return;
  }
  const rawPlan = data && data.plan;
  if(!data || data.app !== "pilatesPlanner" || !rawPlan){
    await showConfirm(t('importInvalidFile'));
    return;
  }
  const shaped = normalizePlanShape(rawPlan);
  const name = await resolveUniqueSavedName(rawPlan.name);
  if(name === null) return;

  const snapshot = {
    name, date: rawPlan.date || new Date().toISOString().slice(0,10),
    items: shaped.items, blocks: shaped.blocks,
    id: Date.now().toString(), favorite:false, listId:null,
    savedAt: new Date().toISOString()
  };
  savedPlans.unshift(snapshot);
  persistSaved();
  renderSaved();
  await showConfirm(t('importSuccess', name));
}

/* ---------- arrastrar para reordenar clases guardadas ---------- */
function bindSavedDrag(entries){
  savedList.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault();
      const item = handle.closest('.saved-item');
      const items = Array.from(savedList.children);
      const startIndex = items.indexOf(item);
      const style = getComputedStyle(item);
      const itemHeight = item.offsetHeight + parseFloat(style.marginBottom || 0);
      const order = items.map((_, k) => k); // visual order, by original index

      let currentIndex = startIndex;
      const startY = e.clientY;

      item.classList.add('dragging');
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      function applyOrder(){
        items.forEach((el, originalPos) => {
          if(el === item) return;
          const visualPos = order.indexOf(originalPos);
          const offset = (visualPos - originalPos) * itemHeight;
          el.style.transition = 'transform .15s ease';
          el.style.transform = offset ? `translateY(${offset}px)` : '';
        });
      }

      function onMove(ev){
        const dy = ev.clientY - startY;
        item.style.transform = `translateY(${dy}px)`;

        const rawTarget = startIndex + Math.round(dy / itemHeight);
        const newIndex = Math.min(items.length - 1, Math.max(0, rawTarget));
        if(newIndex !== currentIndex){
          order.splice(order.indexOf(startIndex), 1);
          order.splice(newIndex, 0, startIndex);
          currentIndex = newIndex;
          applyOrder();
        }
      }

      function onUp(){
        try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onUp);
        item.classList.remove('dragging');
        item.style.transform = '';

        const delta = currentIndex - startIndex;
        if(delta !== 0){
          const dir = delta > 0 ? 1 : -1;
          for(let k = startIndex; k !== currentIndex; k += dir){
            const idxA = entries[k].i, idxB = entries[k+dir].i;
            [savedPlans[idxA], savedPlans[idxB]] = [savedPlans[idxB], savedPlans[idxA]];
          }
          persistSaved();
        }
        renderSaved();
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

/* ---------- mantener presionado: menú de lista/favorito ---------- */
function bindSavedLongPress(){
  savedList.querySelectorAll('.saved-item').forEach(item=>{
    let timer = null, startX = 0, startY = 0, moved = false;
    item.addEventListener('pointerdown', e=>{
      if(e.target.closest('.drag-handle') || e.target.closest('.saved-actions')) return;
      moved = false;
      startX = e.clientX; startY = e.clientY;
      timer = setTimeout(()=>{
        if(moved) return;
        item.classList.remove('pressed');
        if(navigator.vibrate) navigator.vibrate(12);
        openSavedItemMenu(+item.dataset.i);
      }, 480);
      item.classList.add('pressed');
    });
    item.addEventListener('pointermove', e=>{
      if(Math.abs(e.clientX-startX) > 8 || Math.abs(e.clientY-startY) > 8){
        moved = true;
        clearTimeout(timer);
        item.classList.remove('pressed');
      }
    });
    ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
      item.addEventListener(evt, ()=>{ clearTimeout(timer); item.classList.remove('pressed'); });
    });
  });
}

function openSavedItemMenu(idx){
  const p = savedPlans[idx];
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <p class="modal-msg" style="font-weight:500; color:var(--text); margin-bottom:12px;">${escapeHtml(p.name)}</p>
      <button type="button" class="menu-item" data-menu="fav">
        <svg viewBox="0 0 24 24" fill="${p.favorite?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9-6.2-3.3-6.2 3.3 1.2-6.9-5-4.9 6.9-1z"/></svg>
        ${p.favorite ? t('unmarkFavoriteAria') : t('markFavoriteAria')}
      </button>
      <button type="button" class="menu-item" data-menu="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L11 3.83A2 2 0 009.59 3.24L4 3a1 1 0 00-1 1l.24 5.59a2 2 0 00.59 1.41l9.58 9.58a2 2 0 002.82 0l4.36-4.36a2 2 0 000-2.82z"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor" stroke="none"/></svg>
        ${t('assignListAria')}
      </button>
      <button type="button" class="menu-item menu-item-danger" data-menu="del">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
        ${t('deleteSavedAria')}
      </button>
    </div>`;
  document.body.appendChild(overlay);
  function cleanup(){ overlay.remove(); }
  overlay.addEventListener("click", e=>{ if(e.target===overlay) cleanup(); });
  overlay.querySelector('[data-menu="fav"]').addEventListener("click", ()=>{
    savedPlans[idx].favorite = !savedPlans[idx].favorite;
    persistSaved(); cleanup(); renderSaved();
  });
  overlay.querySelector('[data-menu="list"]').addEventListener("click", async ()=>{
    cleanup();
    const result = await showListPickerModal(savedPlans[idx].listId);
    if(result){
      savedPlans[idx].listId = result.assign || null;
      persistSaved();
    }
    renderSaved();
  });
  overlay.querySelector('[data-menu="del"]').addEventListener("click", async ()=>{
    cleanup();
    const ok = await showConfirm(t('confirmDeleteSaved'));
    if(!ok) return;
    savedPlans.splice(idx,1); persistSaved(); renderSaved();
  });
}

  }
}
function ensureSpringRowOpenForTour(){
  const d = document.querySelector(".spring-row");
  if(d) d.open = true;
}

const TOUR_STEPS = {
  clase: [
    { sel: "#searchBox", key: "tour_clase_search" },
    { sel: "#addBlockBtn", key: "tour_clase_addblock" },
    { sel: '#planList .drag-handle', key: "tour_clase_cardmove" },
    { sel: '#planList [data-act="block-select"]', key: "tour_clase_blockselect" },
    { sel: '#planList [data-act="straps-select"]', key: "tour_clase_straps" },
    { sel: '#planList [data-field="reps"]', key: "tour_clase_reps" },
    { sel: '#planList [data-act="add-prop"]', key: "tour_clase_props" },
    { sel: '#planList [data-act="spring+"]', key: "tour_clase_springs" },
    { sel: "#planList .notes-input", key: "tour_clase_notes" },
    { sel: "#saveBtn", key: "tour_clase_save" }
  ],
  biblioteca: [
    { sel: "#libSearch", key: "tour_bib_search", before: ensureLibApparatusForTour },
    { sel: "#apparatusRow .apparatus-toggle button", key: "tour_bib_apparatus", before: ensureLibApparatusForTour },
    { sel: "#filterRow .filter-chip", key: "tour_bib_groups", before: ensureLibApparatusForTour },
    { sel: '#libList [data-act="add-to-plan"]', key: "tour_bib_add", before: ensureLibApparatusForTour },
    { sel: "#newExName", key: "tour_bib_customname", before: ensureLibCustomForTour },
    { sel: "#newExApparatus", key: "tour_bib_customapparatus", before: ensureLibCustomForTour },
    { sel: "#newExGroups", key: "tour_bib_customgroups", before: ensureLibCustomForTour },
    { sel: "#newExPropsRow .check-chip", key: "tour_bib_customprops", before: ensureLibCustomForTour },
    { sel: "#addLibBtn", key: "tour_bib_customadd", before: ensureLibCustomForTour }
  ],
  resortes: [
    { sel: "#springGradientStrip", key: "tour_res_strip" },
    { sel: ".spring-row summary", key: "tour_res_row" },
    { sel: ".spring-row .spring-hex-input", key: "tour_res_hex", before: ensureSpringRowOpenForTour },
    { sel: ".palette-details summary", key: "tour_res_palette", before: ensureSpringRowOpenForTour },
    { sel: "#resetSpringColorsBtn", key: "tour_res_reset" }
  ],
  guardadas: [
    { sel: "#savedSearch", key: "tour_gua_search" },
    { sel: "#favToggleChip", key: "tour_gua_fav" },
    { sel: "#addListChip", key: "tour_gua_lists" },
    { sel: '#savedList .drag-handle', key: "tour_gua_move" },
    { sel: '#savedList .saved-item .info', key: "tour_gua_list" },
    { sel: '#savedList [data-act="view"]', key: "tour_gua_actions" }
  ]
};

let tourState = null;

function currentActiveView(){
  const activeTab = document.querySelector(".tab.active");
  return activeTab ? activeTab.dataset.view : null;
}

function startTour(){
  const view = currentActiveView();
  const steps = TOUR_STEPS[view];
  if(!steps || !steps.length) return;
  tourState = { steps, index: 0 };
  showTourStep();
}

function closeTour(){
  tourState = null;
  ["tourHighlight","tourCallout","tourCloseBtn","tourBlocker"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.remove();
  });
}

function showTourStep(){
  if(!tourState) return;
  const step = tourState.steps[tourState.index];
  if(step.before) step.before();
  const el = document.querySelector(step.sel);
  if(!el){
    if(tourState.index < tourState.steps.length-1){
      tourState.index++;
      showTourStep();
    } else {
      closeTour();
    }
    return;
  }
  el.scrollIntoView({ block:"center", behavior:"instant" });
  setTimeout(()=>positionTourStep(el), 60);
}

function positionTourStep(el){
  if(!tourState) return;
  const step = tourState.steps[tourState.index];
  const r = el.getBoundingClientRect();
  const pad = 6;

  let blocker = document.getElementById("tourBlocker");
  if(!blocker){
    blocker = document.createElement("div");
    blocker.id = "tourBlocker";
    blocker.className = "tour-blocker";
    blocker.addEventListener("click", closeTour);
    document.body.appendChild(blocker);
  }

  let hl = document.getElementById("tourHighlight");
  if(!hl){ hl = document.createElement("div"); hl.id = "tourHighlight"; hl.className = "tour-highlight"; document.body.appendChild(hl); }
  hl.style.top = (r.top-pad)+"px";
  hl.style.left = (r.left-pad)+"px";
  hl.style.width = (r.width+pad*2)+"px";
  hl.style.height = (r.height+pad*2)+"px";

  let cl = document.getElementById("tourCloseBtn");
  if(!cl){
    cl = document.createElement("button");
    cl.id = "tourCloseBtn";
    cl.className = "tour-close";
    cl.addEventListener("click", closeTour);
    document.body.appendChild(cl);
  }
  cl.setAttribute("aria-label", t("tourCloseAria"));
  cl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  let co = document.getElementById("tourCallout");
  if(!co){ co = document.createElement("div"); co.id = "tourCallout"; co.className = "tour-callout"; document.body.appendChild(co); }
  const isLast = tourState.index === tourState.steps.length-1;
  co.innerHTML = `
    <p>${t(step.key)}</p>
    <div class="tour-nav">
      <span class="tour-step-label">${t("tourStepOf", tourState.index+1, tourState.steps.length)}</span>
      <div class="tour-btns">
        <button type="button" class="tour-btn" id="tourPrevBtn" ${tourState.index===0?"disabled":""}>${t("tourPrev")}</button>
        <button type="button" class="tour-btn primary" id="tourNextBtn">${isLast?t("tourDone"):t("tourNext")}</button>
      </div>
    </div>`;

  const vw = window.innerWidth, vh = window.innerHeight;
  const coRect = co.getBoundingClientRect();
  let top = r.bottom + pad + 10;
  if(top + coRect.height > vh - 12) top = r.top - pad - 10 - coRect.height;
  if(top < 12) top = 12;
  let left = r.left;
  if(left + coRect.width > vw - 12) left = vw - coRect.width - 12;
  if(left < 12) left = 12;
  co.style.top = top+"px";
  co.style.left = left+"px";

  document.getElementById("tourPrevBtn").addEventListener("click", ()=>{
    if(tourState.index>0){ tourState.index--; showTourStep(); }
  });
  document.getElementById("tourNextBtn").addEventListener("click", ()=>{
    if(tourState.index < tourState.steps.length-1){ tourState.index++; showTourStep(); }
    else closeTour();
  });
}

document.getElementById("helpTourBtn").addEventListener("click", startTour);

/* ---------- utils ---------- */
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- init ---------- */
applyStaticTranslations();
renderPlan();
</script>
